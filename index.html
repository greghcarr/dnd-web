<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>dnd-web</title>
  </head>
  <body>
    <!-- Map + panel column side by side on desktop, stacked on phones. -->
    <div id="layout">
      <!-- Phaser renders into the map area; the badges overlay it. -->
      <div id="game-root">
        <div id="version-badge"></div>
      </div>
      <aside id="right">
        <section id="mode-selector" class="panel"></section>
        <section id="config-bar" class="panel"></section>
        <div id="transport" class="panel" aria-label="Playback controls"></div>
        <section id="event-inspector" class="panel" aria-label="Event log"></section>
        <section id="narrator-console" class="panel" aria-label="Battle narration"></section>
      </aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
